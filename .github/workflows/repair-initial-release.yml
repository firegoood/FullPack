name: Repair initial release signature metadata

# One-time repair of metadata only: the existing source tag, binaries, archive
# hashes and passed CI gates are immutable. This cannot publish a new version.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.9.1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify exact tested source and existing archive hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.parse, urllib.request
          expected = '5abcbfab71a6e860cf68706a7b21d4c5364eba0a'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, url):
                  fresh = super().redirect_request(req, fp, code, msg, headers, url)
                  if fresh and urllib.parse.urlparse(url).hostname != 'api.github.com':
                      fresh.remove_header('Authorization')
                  return fresh
          opener = urllib.request.build_opener(Redirect())
          base = 'https://api.github.com/repos/firegoood/FullPack/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path, raw=False):
              h = {**headers, 'Accept': 'application/octet-stream'} if raw else headers
              with opener.open(urllib.request.Request(base + path, headers=h), timeout=60) as f:
                  data = f.read()
                  return data if raw else json.loads(data)
          run = get('actions/runs/38558483463')
          assert run['head_sha'] == expected
          gates = [j for j in get('actions/runs/38558483463/jobs?per_page=100')['jobs'] if j['name'].startswith('verify / ')]
          assert len(gates) == 11 and all(j['conclusion'] == 'success' for j in gates)
          # The tag endpoint hides drafts; authenticated listing includes them.
          release = next(r for r in get('releases?per_page=100') if r['tag_name'] == 'v1.9.1')
          assets = {a['name']: a for a in release['assets']}
          archives = {'fullpack_linux_' + a + '.tar.gz' for a in ['amd64', 'arm64', '386', 's390x', 'armv5', 'armv6', 'armv7']}
          root = pathlib.Path('release'); root.mkdir(exist_ok=True)
          sums = get('releases/assets/' + str(assets['SHA256SUMS']['id']), raw=True)
          entries = {row.split()[1].lstrip('*'): row.split()[0] for row in sums.decode().splitlines()}
          assert set(entries) == archives
          # These are the original hashes in the immutable tested release-run
          # log, not a checksum list that an asset editor could replace too.
          original = {
              '386': '9e9cccbfbad0e54de3d8388b3b036adb11372d4ba2d81fd91592b876b2aa3499',
              'amd64': '978df310b3901aa23b9a3980f49436bb21448d2d0373056de8ba1a1e8d8b8246',
              'arm64': '228d95f13b3a7c878e02ea4563f543e35320a8646336b151f8d2af81c3424371',
              'armv5': '3c34e703910b0f7e13509ebbb670266b30009ae99575a16c3fc2ff9b1c59892a',
              'armv6': 'f8e22d0201499fee1d5d173251559638e88359a6336bb0ea23405c6c849f0cb7',
              'armv7': '151c9ca1420ccd2de84ae9a444eca9bfd1fedad6ce2fa83006872a017fcb7cf0',
              's390x': '20428c9b21b328bbe7f24a07a3ce3d81737c3357b796b882042e66dd33b48c50',
          }
          assert entries == {'fullpack_linux_' + a + '.tar.gz': h for a, h in original.items()}
          for name in sorted(archives):
              data = get('releases/assets/' + str(assets[name]['id']), raw=True)
              assert hashlib.sha256(data).hexdigest() == entries[name], name
          (root / 'SHA256SUMS').write_bytes(sums)
          (root / 'RELEASE_TAG').write_text('v1.9.1\n')
          print('Exact source, all 11 CI jobs and all 7 unchanged archive hashes verified.')
          PY

      - name: Sign the unchanged checksum list for its actual tag
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          go run ./tools/signsums release/SHA256SUMS v1.9.1
          go run ./tools/verifysums release/SHA256SUMS v1.9.1
          # A detached signature is public metadata, never the signing key.
          printf 'FULLPACK_V1_9_1_SIGNATURE=%s\n' "$(cat release/SHA256SUMS.sig)"

      - name: Replace only detached signature and tag metadata
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v1.9.1
          target_commitish: 5abcbfab71a6e860cf68706a7b21d4c5364eba0a
          draft: false
          prerelease: false
          files: |
            release/SHA256SUMS.sig
            release/RELEASE_TAG

      - name: Verify public installation
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/firegoood/FullPack/main/install.sh -o /tmp/fullpack-install.sh
          cmp install.sh /tmp/fullpack-install.sh
          sudo bash /tmp/fullpack-install.sh </dev/null
          /usr/local/bin/fullpack version | grep -F v1.9.1
